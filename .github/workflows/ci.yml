name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        # No network, no API key. A test that needs either does not belong here.
        run: pytest -q

      - name: Offline commands must work without a key
        run: |
          prompt-sweep strategies > /dev/null
          prompt-sweep generate "Write a function that retries with backoff" > /dev/null
          prompt-sweep best "Write a function" --strategy minimal > /dev/null

      - name: Offline example must run
        run: python examples/offline_sweep.py > /dev/null
